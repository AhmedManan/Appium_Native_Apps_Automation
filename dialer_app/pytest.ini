[pytest]
# ─── Basic Settings ──────────────────────────────────────────────
testpaths        = tests
python_files     = test_*.py
python_classes   = Test*
python_functions = test_*

# ─── Output ──────────────────────────────────────────────────────
addopts =
    -v
    --tb=short
    --color=yes
    --html=reports/report.html
    --self-contained-html
    --capture=no

# ─── Custom Markers ──────────────────────────────────────────────
markers =
    smoke:          Smoke test — দ্রুত sanity check
    regression:     Regression test — সম্পূর্ণ suite
    skipif_empty_log: Call log ফাঁকা থাকলে skip করে

# ─── Logging ─────────────────────────────────────────────────────
log_cli          = true
log_cli_level    = INFO
log_cli_format   = %(asctime)s  %(levelname)-8s  %(name)s — %(message)s
log_cli_date_format = %H:%M:%S
